################################################################################
# judge0.conf
# Minimal configuration for Judge0 CE (self-hosted)
# Place this file in your project root (next to docker-compose.yml)
################################################################################

# Database
POSTGRES_HOST=judge0_db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass

# Redis
REDIS_HOST=judge0_redis
REDIS_PORT=6379

# Security — disable auth token for local dev (set one in production)
AUTHN_HEADER=
AUTHN_TOKEN=

# Execution limits
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MEMORY_LIMIT=128000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=30
MAX_FILE_SIZE=1024

# Allow all languages
ENABLE_WAIT_RESULT=true